<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-opacity: 0.25; stroke-width: 1; }
    .node-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    .particle {
      animation: float 4s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
  </style>

  <!-- Deep Cosmic Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Dynamic Tech Grid Pattern -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <g opacity="0.45" filter="url(#glow)">
    <circle cx="180" cy="110" r="130" fill="#38bdf8" opacity="0.2" class="node-pulse" />
    <circle cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.2" class="node-pulse" style="animation-delay: 1.5s;" />
    <circle cx="900" cy="90" r="90" fill="#06b6d4" opacity="0.15" class="node-pulse" style="animation-delay: 0.8s;" />
  </g>

  <!-- Animated Data Pipeline Connectors (Background Flow) -->
  <path d="M 120 330 C 350 330, 450 370, 700 370 C 920 370, 1000 320, 1100 320" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" class="flow-line" />
  <path d="M 80 80 C 280 80, 400 40, 650 40 C 900 40, 1020 85, 1120 85" 
        fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" class="flow-line" style="animation-duration: 15s;" />

  <!-- Architectural Floating Nodes (Decorative Serverless Micro-Elements) -->
  <g class="particle" opacity="0.6">
    <circle cx="1080" cy="180" r="4" fill="#38bdf8" />
    <circle cx="120" cy="220" r="3.5" fill="#c084fc" />
    <circle cx="580" cy="50" r="3" fill="#34d399" />
    <circle cx="950" cy="360" r="4" fill="#60a5fa" />
  </g>

  <!-- Foreground Main Content Container -->
  <!-- Pill Tag: Curated Architecture Ecosystem -->
  <g transform="translate(425, 60)">
    <rect width="350" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8" />
    <circle cx="20" cy="17" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="13" font-weight="700" fill="#93c5fd" letter-spacing="0.8">
      CLOUD-NATIVE ARCHITECTURE ECOSYSTEM
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="165" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="46" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.8" filter="url(#glow)">
    Serverless Backup Architecture
  </text>
  <text x="600" y="165" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="46" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.8">
    Serverless Backup Architecture
  </text>

  <!-- Subtitle / Mission Statement -->
  <text x="600" y="215" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
    Event-Driven Snapshot Orchestration, Disaster Recovery &amp; Autonomous Cloud Resilience
  </text>

  <!-- Feature Badge Bar (Floating Pills in Foreground) -->
  <g transform="translate(180, 265)">
    <!-- Pill 1: Event-Driven Orchestration -->
    <g transform="translate(0, 0)">
      <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="92.5" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#e2e8f0">⚡ Event-Driven Triggers</text>
    </g>

    <!-- Pill 2: Kubernetes Native -->
    <g transform="translate(210, 0)">
      <rect width="195" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="97.5" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#e2e8f0">☸️ Kubernetes &amp; State</text>
    </g>

    <!-- Pill 3: Zero-Infrastructure Overhead -->
    <g transform="translate(430, 0)">
      <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="100" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#e2e8f0">☁️ Zero-Server Footprint</text>
    </g>

    <!-- Pill 4: Immutable DR & Deduplication -->
    <g transform="translate(655, 0)">
      <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
      <text x="92.5" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="600" fill="#e2e8f0">🔒 Immutable Recovery</text>
    </g>
  </g>

  <!-- Bottom Sub-tagline -->
  <text x="600" y="365" text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="14" font-weight="500" fill="#64748b">
    Curated for SREs, Platform Engineers, Cloud Architects &amp; DevOps Teams
  </text>
</svg>
